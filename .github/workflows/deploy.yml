name: Deploy Laravel 13 to InfinityFree

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to InfinityFree
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup PHP 8.3 and Composer
      # ==========================================
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, fileinfo, pdo, pdo_mysql, bcmath
          tools: composer


      # ==========================================
      # 3. Get Composer Cache Directory
      # ==========================================
      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 4. Restore Composer Cache
      # ==========================================
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-


      # ==========================================
      # 5. Install Laravel Dependencies
      # ==========================================
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction


      # ==========================================
      # 6. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json


      # ==========================================
      # 7. Install npm Dependencies
      # ==========================================
      - name: Install npm dependencies
        run: npm ci


      # ==========================================
      # 8. Build Vite Assets
      # ==========================================
      - name: Build Vite assets
        run: npm run build


      # ==========================================
      # 9. Prepare Deployment Directory
      # ==========================================
      - name: Prepare deployment directory
        run: |
          rm -rf deploy
          mkdir -p deploy/htdocs/laravel


      # ==========================================
      # 10. Copy Laravel Application
      # ==========================================
      - name: Copy Laravel application files
        run: |
          rsync -av \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='deploy' \
            --exclude='deployment' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='.github' \
            ./ deploy/htdocs/laravel/


      # ==========================================
      # 11. Copy Public Files to htdocs
      # ==========================================
      - name: Copy public files to htdocs
        run: |
          cp -a public/. deploy/htdocs/


      # ==========================================
      # 12. Remove duplicate Laravel public files and storage symlinks
      # ==========================================
      - name: Remove duplicate public index, htaccess, and storage symlink
        run: |
          rm -f deploy/htdocs/laravel/public/index.php
          rm -f deploy/htdocs/laravel/public/.htaccess
          rm -rf deploy/htdocs/storage


      # ==========================================
      # 13. Copy custom InfinityFree files
      # ==========================================
      - name: Copy deployment files
        run: |
          cp -a deployment/htdocs/. deploy/htdocs/


      # ==========================================
      # 14. Protect Laravel Core Directory
      # ==========================================
      - name: Protect Laravel directory
        run: |
          cat << 'EOF' > deploy/htdocs/laravel/.htaccess
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>

          <IfModule !mod_authz_core.c>
              Order deny,allow
              Deny from all
          </IfModule>
          EOF


      # ==========================================
      # 15. Create Required Storage Directories
      # ==========================================
      - name: Create required storage directories
        run: |
          mkdir -p deploy/htdocs/laravel/storage/app/public
          mkdir -p deploy/htdocs/laravel/storage/app/private
          mkdir -p deploy/htdocs/laravel/storage/framework/cache/data
          mkdir -p deploy/htdocs/laravel/storage/framework/sessions
          mkdir -p deploy/htdocs/laravel/storage/framework/views
          mkdir -p deploy/htdocs/laravel/storage/logs


      # ==========================================
      # 16. Deploy to InfinityFree via FTP
      # ==========================================
      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          server-dir: /htdocs/
          local-dir: ./deploy/htdocs/

          protocol: ftp
          timeout: 60000
          log-level: standard

          exclude: |
            **/.env
            **/.env.*
